# Hash-locked test dependencies for the Arion CI lane (.github/workflows/ci.yml).
#
# WHY THIS FILE EXISTS
#   `pyproject.toml` intentionally states only floors (`pytest>=8.0`), which is
#   right for humans and wrong for CI: a resolver run can silently pick up a
#   different pytest (or a newer pluggy that breaks pytest's private API) and
#   turn the same commit into a pass or a fail. CI therefore installs from this
#   file with `pip install --require-hashes`, which makes every artifact explicit
#   and fails closed on any version or hash mismatch.
#
# SCOPE
#   * Platform: Linux, CPython 3.11 ONLY (single-platform lock, no cross-platform
#     universal lock is claimed).
#   * Pure-Python wheels only (`*-py3-none-any.whl`), so one hash per
#     distribution is sufficient and portable across Linux architectures.
#   * `setuptools` is pinned because the project is installed with
#     `--no-build-isolation`, which uses this interpreter's setuptools.
#   * `pip` itself is pinned, so the installer is hash-verified too. Installing
#     it in the same command as everything else keeps a single verified
#     dependency set and a single source of truth.
#   * The project itself is NOT listed: it is installed locally from the
#     checkout and has no runtime dependencies, so there is no remote artifact
#     to hash.
#
# HOW TO UPDATE
#   Bump a version, then recompute its hash for BOTH wheel and sdist artifacts:
#     pip download --no-deps --dest /tmp/w <pkg>==<version>
#     python -c "import hashlib,glob,sys;[print(p,hashlib.sha256(open(p,'rb').read()).hexdigest()) for p in glob.glob('/tmp/w/*')]"
#   Re-run the full suite after any bump. Never edit a hash to "make CI pass".

